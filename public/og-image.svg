<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0a0a0a"/>
  <!-- Subtle grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="0.5"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <!-- Accent glow -->
  <circle cx="900" cy="315" r="250" fill="#6366f1" opacity="0.08"/>
  <circle cx="300" cy="400" r="180" fill="#6366f1" opacity="0.05"/>
  <!-- Text -->
  <text x="100" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="#fafafa">Amit Reddy</text>
  <text x="100" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="400" fill="#6366f1">Software Engineer &amp; ML Researcher</text>
  <text x="100" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#737373">Building intelligent systems and elegant digital experiences</text>
  <!-- Decorative line -->
  <rect x="100" y="420" width="120" height="3" rx="1.5" fill="#6366f1"/>
  <!-- Stats -->
  <text x="100" y="490" font-family="monospace" font-size="16" fill="#525252">9.11 CGPA  ·  3+ Internships  ·  20+ Projects  ·  SRM '27</text>
  <!-- Logo mark -->
  <text x="100" y="570" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#fafafa">amit<tspan fill="#6366f1">.</tspan></text>
</svg>
